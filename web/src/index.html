<!doctype html>
<html lang="en">

<form id="quote-form">
    <label for="author">Author:</label>
    <input type="text" id="author" name="author" placeholder="Unknown">

    <label for="quote">Quote:</label>
    <div class="quote-field">
        <textarea
                id="quote"
                name="quote"
                maxlength="547"
                required
                aria-describedby="quote-required"
        ></textarea>
        <small id="quote-required" class="required-message">Quote is required...</small>
    </div>

    <label for="tag-search">Tags:</label>

    <div class="tags-field">
        <div id="tags-box" class="tags-box">
            <div id="selected-tags" class="selected-tags"></div>

            <input
                    type="text"
                    id="tag-search"
                    class="tag-search"
                    placeholder="Add"
                    autocomplete="off"
                    readonly
                    aria-controls="tag-options"
                    aria-expanded="false"
            >
        </div>

        <div id="tag-options" class="tag-options" hidden>
            <input
                    type="search"
                    id="tag-filter"
                    class="tag-filter"
                    placeholder="Search tags..."
                    autocomplete="off"
                    aria-controls="tag-option-list"
            >
            <div id="tag-option-list" class="tag-option-list"></div>
        </div>

        <input type="hidden" id="tags" name="tags">

        <small id="tags-required" class="required-message">
            Tags are required...
        </small>
    </div>

    <input type="submit" value="Submit">

</form>


<button id="export-to-json-button" type="button">
    Export Quotes to JSON
</button>

<table id="quotes-table">
    <tr>
        <th>Author</th>
        <th>Quote</th>
        <th>Tags</th>
        <th>Created At</th>
    </tr>
    <tbody id="rows">
    <tr id="loading-row">
        <td colspan="4">
            <div class="loading-status" role="status">
                <span class="loading-spinner" aria-hidden="true"></span>
                Loading quotes…
            </div>
        </td>
    </tr>

    </tbody>
</table>

<div class=table-controls>
    <div class="pagination-controls">
        <nav id="pagination" class="pagination" aria-label="Quotes pages"></nav>

        <button
                id="refresh-quotes"
                type="button"
                aria-label="Refresh quotes"
                title="Refresh quotes"
        >
            <span aria-hidden="true">↻</span>
        </button>
    </div>

    <button id="delete-quote-button" type="button">
        Delete Quote
    </button>
</div>


<script src="renderer.js"></script>
</html>
