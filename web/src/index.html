<!doctype html>
<html lang="en">

<dialog
        id="auth-dialog"
        aria-labelledby="auth-dialog-title"
        aria-describedby="auth-dialog-message"
        tabindex="-1"
>
    <h1 id="auth-dialog-title">Checking sign-in…</h1>
    <p id="auth-dialog-message">Restoring the saved Google session.</p>
    <p id="auth-dialog-account" hidden></p>
    <button id="auth-dialog-action" type="button" hidden></button>
</dialog>

<form id="quote-form">
    <label for="author">Author:</label>
    <input type="text" id="author" name="author" placeholder="Unknown">

    <label for="quote">Quote:</label>
    <div class="quote-field">
        <textarea
                id="quote"
                name="quote"
                maxlength="547"
                required
                aria-describedby="quote-required"
        ></textarea>
        <small id="quote-required" class="required-message">Quote is required...</small>
    </div>

    <label for="tag-search">Tags:</label>

    <div class="tags-field">
        <div id="tags-box" class="tags-box">
            <div id="selected-tags" class="selected-tags"></div>

            <input
                    type="text"
                    id="tag-search"
                    class="tag-search"
                    placeholder="Add"
                    autocomplete="off"
                    readonly
                    aria-controls="tag-options"
                    aria-expanded="false"
            >
        </div>

        <div id="tag-options" class="tag-options" hidden>
            <input
                    type="search"
                    id="tag-filter"
                    class="tag-filter"
                    placeholder="Search tags..."
                    autocomplete="off"
                    aria-controls="tag-option-list"
            >
            <div id="tag-option-list" class="tag-option-list"></div>
        </div>

        <input type="hidden" id="tags" name="tags">

        <small id="tags-required" class="required-message">
            Tags are required...
        </small>
    </div>

    <input type="submit" value="Submit">

</form>


<button id="export-to-json-button" type="button">
    Export Quotes to JSON
</button>

<table id="quotes-table">
    <tr>
        <th>Author</th>
        <th>Quote</th>
        <th>Tags</th>
        <th>Created At</th>
    </tr>
    <tbody id="rows">
    <tr id="loading-row">
        <td colspan="4">
            <div class="loading-status" role="status">
                <span class="loading-spinner" aria-hidden="true"></span>
                Loading quotes…
            </div>
        </td>
    </tr>

    </tbody>
</table>

<div class=table-controls>
    <div class="pagination-controls">
        <nav id="pagination" class="pagination" aria-label="Quotes pages"></nav>

        <button
                id="refresh-quotes"
                type="button"
                aria-label="Refresh quotes"
                title="Refresh quotes"
        >
            <span aria-hidden="true">↻</span>
        </button>
    </div>

    <div class="quote-search-controls">
        <input
                id="quote-search"
                class="quote-search"
                type="search"
                placeholder="Search quotes..."
                autocomplete="off"
                aria-label="Search quotes"
                aria-controls="rows"
        >

        <button
                id="quote-sort-button"
                type="button"
                aria-label="Sort quotes"
                title="Sort quotes"
                aria-controls="quote-sort-popover"
                aria-expanded="false"
                popovertarget="quote-sort-popover"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5h16l-6.5 7.2v5.3l-3 1.5v-6.8z"></path>
            </svg>
        </button>
    </div>

    <div
            id="quote-sort-popover"
            popover="auto"
            role="dialog"
            aria-label="Sort quotes"
    >
        <div id="quote-sort-fields" class="quote-sort-panel">
            <div class="quote-sort-heading">Sort by</div>

            <button type="button" class="quote-sort-field" data-sort-field="author">
                <span class="quote-sort-field-icon" aria-hidden="true">A</span>
                Author
            </button>
            <button type="button" class="quote-sort-field" data-sort-field="quote">
                <span class="quote-sort-field-icon" aria-hidden="true">A</span>
                Quote
            </button>
            <button type="button" class="quote-sort-field" data-sort-field="createdAt">
                <svg class="quote-sort-field-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 3v3M18 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1z"></path>
                </svg>
                Created At
            </button>

            <button id="clear-quote-sort" type="button" hidden>Clear sort</button>
        </div>

        <div id="quote-sort-options" class="quote-sort-panel" hidden>
            <button id="quote-sort-back" type="button">
                <span aria-hidden="true">&#8592;</span>
                <span id="quote-sort-field-label"></span>
            </button>
            <button type="button" class="quote-sort-option" data-sort-direction="ascending"></button>
            <button type="button" class="quote-sort-option" data-sort-direction="descending"></button>
        </div>
    </div>

    <button
            id="delete-quote-button"
            type="button"
            disabled
            aria-label="Delete selected quotes"
            title="Delete selected quotes"
    >
        Delete
    </button>
</div>
</html>
