<!doctype html>
<html>

<form id="quote-form">
    <label for="author">Author:</label>
    <input type="text" id="author" name="author"><br><br>

    <label for="quote">Quote:</label>
    <textarea id="quote" name="quote" maxlength="547"></textarea>

    <label for="tags">Tags:</label>
    <input type="text" id="tags" name="tags"><br><br>

    <input type="submit" value="Submit">

</form>


<button id="export-to-json-button" type="button">
    Export Quotes to JSON
</button>

<table id="quotes-table">
    <tr>
        <th>Author</th>
        <th>Quote</th>
        <th>Tags</th>
        <th>Created At</th>
    </tr>
    <tbody id="rows">
    <tr id="loading-row">
        <td colspan="4">
            <div class="loading-status" role="status">
                <span class="loading-spinner" aria-hidden="true"></span>
                Loading quotes…
            </div>
        </td>
    </tr>

    </tbody>
</table>

<nav id="pagination" class="pagination" aria-label="Quotes pages"></nav>

<script src="renderer.js"></script>
</html>
